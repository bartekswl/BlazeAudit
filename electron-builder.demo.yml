extends: electron-builder.yml

productName: BlazeAudit Demo

extraResources:
  - from: resources/app-icon.png
    to: app-icon.png
  - from: resources/titlebar-icon.png
    to: titlebar-icon.png
  - from: resources/app-icon.ico
    to: app-icon.ico
  - from: resources/ocr
    to: ocr
  - from: resources/demo
    to: demo

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: BlazeAudit Demo

# Inherits GitHub publish from electron-builder.yml so app-update.yml is
# embedded — demo builds check the same release feed for testing updates.
